name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npx ng build ng-dnd-form-builder
      - run: npm publish --provenance --access public
        working-directory: dist/ng-dnd-form-builder
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
